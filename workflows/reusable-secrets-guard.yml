name: Reusable Terraform guard

on:
  workflow_call:
    inputs:
      source_ref:
        description: Commit SHA or Git ref to scan
        required: true
        type: string

      working_directory:
        description: Repository-relative directory to scan
        required: false
        type: string
        default: "."

permissions:
  contents: read

jobs:
  guard:
    name: Terraform repository guard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Run Terraform guard
        uses: Snowstack-AI/tf-ci-templates/.github/actions/tf-guard@main
        with:
          working_directory: ${{ inputs.working_directory }}
