name: Verify workflow run
description: Verify that a workflow run is the expected successful plan run

inputs:
  run_id:
    description: Workflow run ID to verify
    required: true

  expected_workflow_path:
    description: Expected repository-relative workflow file path
    required: true

  expected_event:
    description: Expected event that triggered the workflow run
    required: true

  expected_branch:
    description: Expected head branch of the workflow run
    required: true

  github_token:
    description: GitHub token with actions read permission
    required: false
    default: ${{ github.token }}

outputs:
  workflow_sha:
    description: Head SHA of the verified workflow run
    value: ${{ steps.verify.outputs.workflow_sha }}

runs:
  using: composite

  steps:
    - name: Verify workflow run
      id: verify
      uses: actions/github-script@v8
      with:
        github-token: ${{ inputs.github_token }}
        script: |
          const runIdRaw = ${{ toJSON(inputs.run_id) }};
          const runId = Number(runIdRaw);
          const expectedWorkflowPath = ${{ toJSON(inputs.expected_workflow_path) }};
          const expectedEvent = ${{ toJSON(inputs.expected_event) }};
          const expectedBranch = ${{ toJSON(inputs.expected_branch) }};

          if (!Number.isInteger(runId) || runId <= 0) {
            core.setFailed(`run_id must be a positive integer, got: ${JSON.stringify(runIdRaw)}`);
            return;
          }

          const { data: run } = await github.rest.actions.getWorkflowRun({
            owner: context.repo.owner,
            repo: context.repo.repo,
            run_id: runId,
          });

          const { data: workflow } = await github.rest.actions.getWorkflow({
            owner: context.repo.owner,
            repo: context.repo.repo,
            workflow_id: run.workflow_id,
          });

          if (workflow.path !== expectedWorkflowPath) {
            core.setFailed(
              `run_id ${runId} belongs to workflow '${run.path}', ` +
              `expected '${expectedWorkflowPath}'`
            );
            return;
          }

          if (run.event !== expectedEvent) {
            core.setFailed(
              `run_id ${runId} was triggered by '${run.event}', expected '${expectedEvent}'`
            );
            return;
          }

          if (run.head_branch !== expectedBranch) {
            core.setFailed(
              `run_id ${runId} ran from branch '${run.head_branch}', expected '${expectedBranch}'`
            );
            return;
          }

          if (run.status !== 'completed' || run.conclusion !== 'success') {
            core.setFailed(
              `run_id ${runId} is not a successful completed run ` +
              `(status=${run.status}, conclusion=${run.conclusion})`
            );
            return;
          }

          core.info(`Verified run ${runId}: ${run.html_url}`);
          core.setOutput('workflow_sha', run.head_sha);
